<!--
  Figma Plugin MCP — plugin UI iframe.
  Self-contained: WebSocket client + heartbeat + auto-reconnect + status UI.
  Relays request/response WireMessages between the WS bridge and the Figma
  main thread (code.js) via postMessage.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --panel: #f7f7fa;
    --fg: #1b1b1f;
    --muted: #6b6b73;
    --line: #e4e4e8;
    --ok: #1a9d54;
    --warn: #d98a00;
    --bad: #d13438;
    --chip: #f2f2f4;
    --accent-a: #6d5bd0;
    --accent-b: #4f8ef7;
    --log-bg: #f2f2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e22;
      --panel: #17171b;
      --fg: #ececf0;
      --muted: #9a9aa2;
      --line: #34343a;
      --ok: #35c377;
      --warn: #e0a838;
      --bad: #f16a6e;
      --chip: #2a2a30;
      --accent-a: #8b7bf0;
      --accent-b: #6ea8ff;
      --log-bg: #131316;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font: 12px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  /* min-height + overflow, NOT height: a fixed-height flex column silently
     SQUEEZES every child that can shrink, and a child with overflow:auto can
     shrink to nothing — which is how the demo list ended up showing half a
     line of clipped text instead of its own empty state. */
  .wrap {
    padding: 14px; display: flex; flex-direction: column; gap: 12px;
    min-height: 100%; box-sizing: border-box; overflow-y: auto;
  }

  .header { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto;
    display: block; object-fit: contain;
  }
  .header-text { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 13px; }
  .subtitle { color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lang-switch {
    display: inline-flex; flex: 0 0 auto; border: 1px solid var(--line);
    border-radius: 6px; overflow: hidden; background: var(--panel);
  }
  .lang-btn {
    flex: 0 0 auto; border: none; border-radius: 0; background: transparent;
    color: var(--muted); font-size: 10px; font-weight: 600; padding: 3px 6px;
    cursor: pointer; line-height: 1.2;
  }
  .lang-btn:hover { color: var(--fg); border-color: transparent; }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff;
  }

  .status-row {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; background: var(--panel);
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--muted); flex: 0 0 auto;
    box-shadow: 0 0 0 3px transparent;
    transition: background .2s, box-shadow .2s;
  }
  .dot.ok { background: var(--ok); box-shadow: 0 0 0 3px rgba(53,195,119,.18); }
  .dot.connecting { background: var(--warn); box-shadow: 0 0 0 3px rgba(224,168,56,.18); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px rgba(209,52,56,.18); }
  .status { flex: 1; min-width: 0; }
  .meta { color: var(--muted); font-size: 10.5px; }
  .port-chip {
    display: inline-block; padding: 1px 7px; border-radius: 999px;
    background: var(--chip); color: var(--fg); font-size: 10.5px;
    font-variant-numeric: tabular-nums;
  }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat-card {
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    padding: 8px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .stat-num { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stat-num.writes { color: var(--accent-a); }
  .stat-num.reads { color: var(--accent-b); }
  .stat-num.errors { color: var(--bad); }
  .stat-label { color: var(--muted); font-size: 9.5px; letter-spacing: .04em; text-transform: uppercase; }

  .section-label { color: var(--muted); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; }

  .channel-row {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; background: var(--panel);
  }
  .channel-chip {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    color: #fff; font-size: 11px; font-weight: 600; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;
  }
  .channel-chip:hover { filter: brightness(1.1); }
  .channel-label { color: var(--muted); font-size: 10.5px; flex: 1; }
  button.mini {
    flex: 0 0 auto; padding: 3px 8px; font-size: 10.5px; border-radius: 6px;
  }
  .channel-editor { display: none; gap: 6px; align-items: center; }
  .channel-editor.open { display: flex; }
  .channel-editor input {
    flex: 1; min-width: 0; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px;
  }

  /* REST Token (PAT): the value is typed into a password field and handed to
     the main thread (clientStorage). The badge only ever shows the server's
     verdict — state + handle — never the token. */
  .token-row {
    display: flex; flex-direction: column; gap: 6px;
    border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 10px; background: var(--panel);
  }
  .token-head { display: flex; align-items: center; gap: 8px; }
  .token-label { color: var(--muted); font-size: 10.5px; flex: 1; }
  .token-badge {
    display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 10.5px;
    background: var(--chip); color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 170px;
  }
  .token-badge.ok { color: var(--ok); }
  .token-badge.warn { color: var(--warn); }
  .token-badge.bad { color: var(--bad); }
  .token-editor { display: flex; gap: 6px; align-items: center; }
  .token-expiry {
    flex: 0 0 auto; font: inherit; font-size: 10.5px; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 2px;
  }
  .token-editor input {
    flex: 1; min-width: 0; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px;
  }
  .log-tag {
    flex: 0 0 auto; font-size: 9px; font-weight: 700; letter-spacing: .04em;
    color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 3px;
  }

  .agents {
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    max-height: 150px; overflow-y: auto; padding: 4px 6px;
    flex: 0 0 auto; min-height: 30px;
  }
  .agents-empty { color: var(--muted); font-size: 11px; padding: 6px 2px; }
  .agent-row {
    display: flex; align-items: center; gap: 7px; padding: 5px 2px;
    border-bottom: 1px solid var(--line); font-size: 11px;
  }
  .agent-row:last-child { border-bottom: none; }
  .agent-id { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .agent-meta { color: var(--muted); font-size: 10px; flex: 0 0 auto; }
  .agent-state-here { color: var(--ok); font-size: 10px; flex: 0 0 auto; font-weight: 600; }
  .agent-state-other { color: var(--warn); font-size: 10px; flex: 0 0 auto; }

  button.icon {
    flex: 0 0 auto; padding: 2px 7px; font-size: 11px; border-radius: 6px; line-height: 1.4;
  }
  button.icon.play {
    border: none; color: #fff;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  }

  .activity {
    flex: 1; min-height: 90px; max-height: 200px; overflow-y: auto;
    border: 1px solid var(--line); border-radius: 8px; background: var(--log-bg);
    padding: 6px 8px;
  }
  .activity-empty { color: var(--muted); font-size: 11px; padding: 6px 2px; }
  .log-row {
    display: flex; align-items: baseline; gap: 6px; padding: 3px 0;
    border-bottom: 1px solid var(--line); font-size: 11px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-kind {
    flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; margin-top: 4px;
  }
  .log-kind.write { background: var(--accent-a); }
  .log-kind.read { background: var(--accent-b); }
  .log-kind.error { background: var(--bad); }
  .log-op { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-time { color: var(--muted); font-size: 10px; flex: 0 0 auto; }

  .actions { display: flex; gap: 8px; }
  button {
    font: inherit; border: 1px solid var(--line); background: var(--chip);
    color: var(--fg); border-radius: 7px; padding: 6px 10px; cursor: pointer;
    flex: 1;
  }
  button:hover { border-color: var(--muted); }
  button.primary {
    border: none; color: #fff;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
  }
  button.primary:hover { filter: brightness(1.08); }

  .foot { color: var(--muted); font-size: 9.5px; text-align: center; }

  /* Corner grip — the panel is often opened on a laptop screen where 660px
     of height does not exist. Dragging this posts the new size to the main
     thread, which is the only side allowed to call figma.ui.resize(). It is
     `fixed`, not in the flow, so it never scrolls away with .wrap. */
  .grip {
    position: fixed; right: 0; bottom: 0; width: 16px; height: 16px;
    cursor: nwse-resize; z-index: 10; touch-action: none;
    color: var(--muted); opacity: .55;
  }
  .grip:hover { opacity: 1; }
  .grip svg { display: block; }
</style>

<div class="wrap">
  <div class="header">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Figma Plugin MCP" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#2563EB"/><rect x="14" y="14" width="16" height="16" rx="4" fill="#fff"/><rect x="34" y="14" width="16" height="16" rx="8" fill="#fff" opacity=".75"/><rect x="14" y="34" width="16" height="16" rx="8" fill="#fff" opacity=".75"/><rect x="34" y="34" width="16" height="16" rx="4" fill="#fff" opacity=".5"/></svg>
    <div class="header-text">
      <span class="title">Figma Plugin MCP</span>
      <span class="subtitle" id="file">AI-powered design bridge</span>
    </div>
    <div class="lang-switch" id="lang-switch" title="Switch interface language (English / Tiếng Việt)">
      <button type="button" class="lang-btn active" id="lang-en">EN</button>
      <button type="button" class="lang-btn" id="lang-vi">VI</button>
    </div>
  </div>

  <div class="status-row" id="status-row" title="WebSocket connection status between this Figma plugin and the local MCP server.">
    <span id="dot" class="dot connecting"></span>
    <span class="status" id="status">Connecting…</span>
    <span class="port-chip" id="port" title="Local WebSocket port of the MCP server (scans 38470–38479).">—</span>
  </div>

  <div class="channel-row">
    <span class="channel-label" id="channel-label" title="Channel ID that identifies this Figma window so AI agents can route commands to the right file.">Channel</span>
    <span class="channel-chip" id="channel-chip" title="Click to copy">—</span>
    <button class="mini" id="channel-edit" title="Rename this window's channel ID (useful when multiple Figma files are open).">Change</button>
  </div>
  <div class="channel-editor" id="channel-editor">
    <input id="channel-input" placeholder="channel name (a-z 0-9 - _ .)" maxlength="64" title="Allowed characters: letters, digits, -, _, . (max 64 chars).">
    <button class="mini primary" id="channel-join" title="Save this channel name and reconnect to the MCP server.">Join</button>
    <button class="mini" id="channel-cancel" title="Cancel editing channel">✕</button>
  </div>

  <div class="token-row">
    <div class="token-head">
      <span class="token-label" id="token-label" title="Figma personal access token. Stored on this machine only (figma.clientStorage); the MCP server keeps it in memory and uses it for links to files that are not open, comments and version history.">REST Token (PAT)</span>
      <span class="token-badge" id="token-badge">Not set</span>
    </div>
    <div class="token-editor">
      <input id="token-input" type="password" placeholder="figd_…" autocomplete="off" spellcheck="false" maxlength="512" title="Paste your Figma Personal Access Token (figd_…). Stored locally in figma.clientStorage, never in the Figma file.">
      <select id="token-expiry" class="token-expiry" title="Expiration you picked when creating the token in Figma. Figma's API cannot report it, so the panel counts down from here.">
        <option value="" id="opt-exp-unknown">Exp: ?</option>
        <option value="1" id="opt-exp-1">1 day</option>
        <option value="7" id="opt-exp-7">7 days</option>
        <option value="30" id="opt-exp-30">30 days</option>
        <option value="90" id="opt-exp-90">90 days</option>
      </select>
      <button class="mini primary" id="token-save" title="Save token locally and verify it with the MCP server (/v1/me).">Save</button>
      <button class="mini" id="token-clear" title="Remove the saved REST token from this machine and server memory.">Clear</button>
    </div>
  </div>

  <div class="section-label" id="sessions-label" title="Each row is one Claude Code / Codex instance. Connect routes its commands to this window."><span id="sessions-label-text">AI sessions</span> (<span id="agent-count">0</span>)</div>
  <div class="agents" id="agents">
    <div class="agents-empty" id="agents-empty">No AI sessions yet.</div>
  </div>


  <div class="stats">
    <div class="stat-card" id="stat-writes-card" title="Number of canvas or REST write operations executed in this session.">
      <span class="stat-num writes" id="stat-writes">0</span>
      <span class="stat-label" id="stat-writes-label">Writes</span>
    </div>
    <div class="stat-card" id="stat-reads-card" title="Number of canvas or REST read operations executed in this session.">
      <span class="stat-num reads" id="stat-reads">0</span>
      <span class="stat-label" id="stat-reads-label">Reads</span>
    </div>
    <div class="stat-card" id="stat-errors-card" title="Number of failed operations (canvas or REST API) in this session.">
      <span class="stat-num errors" id="stat-errors">0</span>
      <span class="stat-label" id="stat-errors-label">Errors</span>
    </div>
  </div>

  <div class="section-label" id="activity-label" title="Live log of recent plugin and [REST] operations with execution time.">Activity</div>
  <div class="activity" id="activity">
    <div class="activity-empty" id="activity-empty">No activity yet.</div>
  </div>

  <div class="actions">
    <button id="clear" title="Clear the Activity log and reset the Writes/Reads/Errors counters.">Clear</button>
    <button id="autodetect" title="Immediately scan ports 38470–38479 to find and connect to a running MCP server.">Auto-detect</button>
    <button id="retry" class="primary" title="Close the current socket and reconnect to the MCP server immediately.">Reconnect</button>
  </div>

  <div class="foot" id="foot">Connects to the local Figma Plugin MCP bridge (localhost:38470 +9).</div>
</div>

<div class="grip" id="grip" title="Drag to resize">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
    <path d="M15 6 L6 15 M15 11 L11 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
</div>

<script>
(function () {
  "use strict";

  // ---- constants mirrored from src/shared/protocol.ts ----
  var DEFAULT_PORT = 38470;
  var PORT_RANGE = 10;
  var HEARTBEAT_INTERVAL_MS = 5000;
  // One missed ping round + slack. At 30s the plugin sat "Connected" on a dead
  // socket for half a minute while the server showed no plugin — 12s bounds
  // the lie window to about one failed exchange.
  var HEARTBEAT_DEAD_MS = 12000;
  var BACKOFF_MIN = 500;
  var BACKOFF_MAX = 8000;
  // After LOSING an established connection, keep retrying the port that
  // worked, every FAST_RETRY_MS for FAST_RETRY_WINDOW_MS, before walking the
  // range: a restarted or taken-over leader rebinds that same port within
  // about a second, and walking first meant a full lap of dead ports (tens of
  // seconds) before coming back to it.
  var FAST_RETRY_MS = 500;
  var FAST_RETRY_WINDOW_MS = 10000;
  var WALK_STEP_MS = 600;
  // A port that accepts TCP but never completes the WebSocket handshake
  // (something else listening there) must not stall the walk.
  var CONNECT_TIMEOUT_MS = 2500;
  // Wait this long for the main thread's hello (stored channel + resume
  // token) before connecting anyway.
  var HELLO_WAIT_MS = 1000;
  var MAX_LOG_ROWS = 100;

  // Mirrored from src/shared/protocol.ts WRITE_OPERATIONS — used to classify
  // activity rows as write/read since BridgeResponse itself carries no kind.
  var WRITE_OPS = {
    create: 1, modify: 1, delete: 1, clone: 1, move: 1, resize: 1, group: 1,
    ungroup: 1, flatten: 1, batch: 1,
    setup_tokens: 1, setup_text_styles: 1, setup_effect_styles: 1,
    set_text_style: 1, apply_variable: 1, create_variable: 1,
    update_variable: 1, rename_variable: 1, delete_variable: 1,
    import_tokens: 1, set_text: 1, load_icon: 1,
    load_image: 1, create_page: 1, delete_page: 1, delete_style: 1, delete_unused_styles: 1,
    set_current_page: 1, create_overlay: 1, set_selection: 1, zoom_to_fit: 1,
    set_selection_colors: 1, set_gradient: 1, set_effects: 1, set_reactions: 1,
    create_userflow: 1, create_activity: 1, create_erd: 1, create_sequence: 1,
    create_state: 1, create_sitemap: 1, reflow_diagram: 1
  };

  // ---- state ----
  var ws = null;                   // the CURRENT socket; handlers of any other ignore themselves
  var portIndex = 0;               // which port in the fallback range we are trying
  var lostAt = 0;                  // when an established connection dropped (fast-retry window)
  var lastGoodIndex = 0;           // portIndex of the last connection that opened
  var backoff = BACKOFF_MIN;
  var reconnectTimer = null;
  var connectTimer = null;
  var started = false;             // connect() runs once the hello is in (or HELLO_WAIT_MS)
  var requestedChannel = null;     // channel the last hello asked for (to notice a different assign)
  var heartbeatTimer = null;
  var lastHeartbeatAt = 0;
  var connectedPort = null;
  var handshake = null;            // {pluginVersion, protocolVersion}
  var hello = null;                // hello data relayed from main thread
  var attemptCount = 0;
  var counts = { writes: 0, reads: 0, errors: 0 };
  var channel = null;
  var resumeToken = null;              // desired/joined channel; null → server assigns
  var channelsUpdate = null;       // latest {self, channels, sessions} push
  var replacedByPeer = false;      // this window's channel was taken elsewhere
  var restToken = null;            // PAT from clientStorage (main thread); sent to the server, never shown
  var restExpiresAt = null;        // epoch ms the user said it expires (Figma cannot be asked)
  var restSavedAt = null;          // when this token / Clear was saved; the server keeps the newest
  var restStatus = null;           // latest rest_status from the server
  var pendingStatus = null;        // the badge before a Save, restored if the Save is refused
  var restAnswerTimer = null;      // armed when the token is sent; any rest_status disarms it
  var assignedSock = null;         // the socket that received `assigned` — only it may carry the token
  var langChosen = false;          // the user clicked a language; a late stored value must not undo it
  var REST_ANSWER_MS = 12000;

  // ---- DOM ----
  var el = {
    dot: document.getElementById("dot"),
    status: document.getElementById("status"),
    port: document.getElementById("port"),
    file: document.getElementById("file"),
    retry: document.getElementById("retry"),
    clear: document.getElementById("clear"),
    autodetect: document.getElementById("autodetect"),
    activity: document.getElementById("activity"),
    activityEmpty: document.getElementById("activity-empty"),
    statWrites: document.getElementById("stat-writes"),
    statReads: document.getElementById("stat-reads"),
    statErrors: document.getElementById("stat-errors"),
    foot: document.getElementById("foot"),
    channelChip: document.getElementById("channel-chip"),
    channelEdit: document.getElementById("channel-edit"),
    channelEditor: document.getElementById("channel-editor"),
    channelInput: document.getElementById("channel-input"),
    channelJoin: document.getElementById("channel-join"),
    channelCancel: document.getElementById("channel-cancel"),
    agents: document.getElementById("agents"),
    agentsEmpty: document.getElementById("agents-empty"),
    agentCount: document.getElementById("agent-count"),
    tokenBadge: document.getElementById("token-badge"),
    tokenInput: document.getElementById("token-input"),
    tokenSave: document.getElementById("token-save"),
    tokenClear: document.getElementById("token-clear"),
    tokenExpiry: document.getElementById("token-expiry"),
    langEn: document.getElementById("lang-en"),
    langVi: document.getElementById("lang-vi"),
    statusRow: document.getElementById("status-row"),
    channelLabel: document.getElementById("channel-label"),
    tokenLabel: document.getElementById("token-label"),
    sessionsLabel: document.getElementById("sessions-label"),
    sessionsLabelText: document.getElementById("sessions-label-text"),
    statWritesCard: document.getElementById("stat-writes-card"),
    statReadsCard: document.getElementById("stat-reads-card"),
    statErrorsCard: document.getElementById("stat-errors-card"),
    statWritesLabel: document.getElementById("stat-writes-label"),
    statReadsLabel: document.getElementById("stat-reads-label"),
    statErrorsLabel: document.getElementById("stat-errors-label"),
    activityLabel: document.getElementById("activity-label"),
    grip: document.getElementById("grip"),
    optExpUnknown: document.getElementById("opt-exp-unknown"),
    optExp1: document.getElementById("opt-exp-1"),
    optExp7: document.getElementById("opt-exp-7"),
    optExp30: document.getElementById("opt-exp-30"),
    optExp90: document.getElementById("opt-exp-90"),
  };

  var I18N = {
    en: {
      subtitleDefault: "AI-powered design bridge",
      statusRowTitle: "WebSocket connection status between this Figma plugin and the local MCP server.",
      portTitle: "Local WebSocket port of the MCP server (scans 38470–38479).",
      channelLabel: "Channel",
      channelTitle: "Channel ID that identifies this Figma window so AI agents can route commands to the right file.",
      channelChange: "Change",
      channelChangeTitle: "Rename this window's channel ID (useful when multiple Figma files are open).",
      channelInputPlaceholder: "channel name (a-z 0-9 - _ .)",
      channelInputTitle: "Allowed characters: letters, digits, -, _, . (max 64 chars).",
      channelJoin: "Join",
      channelJoinTitle: "Save this channel name and reconnect to the MCP server.",
      channelCancelTitle: "Cancel editing channel",
      channelCopyPrefix: "Click to copy \"",
      channelWaiting: "Waiting for the server to assign a channel",
      copied: "copied!",
      tokenLabel: "REST Token (PAT)",
      tokenTitle: "Figma personal access token. Stored on this machine only (figma.clientStorage); the MCP server keeps it in memory and uses it for links to files that are not open, comments and version history.",
      tokenInputTitle: "Paste your Figma Personal Access Token (figd_…). Stored locally in figma.clientStorage, never in the Figma file.",

  }

    if (el.optExp90) el.optExp90.textContent = t("exp90");

    if (el.statReadsLabel) el.statReadsLabel.textContent = t("reads");

  function humanLeft(ms) {
    if (ms <= 0) return t("expired");
    if (ms < 3600000) return Math.max(1, Math.round(ms / 60000)) + "m" + t("leftSuffix");
    if (ms < 172800000) return Math.round(ms / 3600000) + "h" + t("leftSuffix");
    return Math.round(ms / 86400000) + "d" + t("leftSuffix");
  }

  // ---- REST token badge ----
  // Not set · Checking… · Valid (@handle) · Expired / Invalid (401/403) · Rate-limited (429)
  function restBadge(st) {
    if (!st || st.state === "not_set") return { cls: "", text: t("notSet") };
    var env = st.source === "env" ? " · env" : "";
    switch (st.state) {
      case "checking": return { cls: "warn", text: t("checking") };
      case "unverified": return { cls: "warn", text: t("unverified") + env };
      case "valid": {
        var lacking = !!(st.missingScopes && st.missingScopes.length);
        var exp = st.expiresAt || restExpiresAt;
        if (exp) {
          var left = exp - Date.now();
          // Figma has not refused it yet, but the date the user gave has passed.
          if (left <= 0) return { cls: "bad", text: t("expiredDate") + env };
          var name = st.handle ? t("valid") + " (@" + st.handle + ")" : t("valid");
          return { cls: left < 86400000 || lacking ? "warn" : "ok", text: name + " · " + humanLeft(left) + env };
        }
        return { cls: lacking ? "warn" : "ok", text: (st.handle ? t("valid") + " (@" + st.handle + ")" : t("valid")) + env };
      }
      case "invalid": return { cls: "bad", text: t("expiredInvalid") + " (" + (st.httpStatus || "401/403") + ")" + env };
      case "rate_limited": {
        var wait = st.retryAt ? st.retryAt - Date.now() : 0;
        return { cls: "warn", text: t("rateLimited") + (wait > 0 ? " · " + t("retryIn") + humanLeft(wait).replace(t("leftSuffix"), "") : "") + env };
      }
      case "error": return { cls: "bad", text: (st.noAnswer ? t("noAnswer") : t("checkFailed")) + env };
      default: return { cls: "", text: String(st.state) };
    }
  }

  function renderToken() {
    var b = restBadge(restStatus);
    el.tokenBadge.className = "token-badge" + (b.cls ? " " + b.cls : "");
    el.tokenBadge.textContent = b.text;
    var title = restStatus && restStatus.masked ? t("tokenPrefix") + restStatus.masked : t("noToken");
    if (restStatus && restStatus.noAnswer) title += " — " + t("noAnswerTitle");
    else if (restStatus && restStatus.message) title += " — " + restStatus.message;
    if (restStatus && restStatus.missingScopes && restStatus.missingScopes.length) title += "\n" + t("missingScopes") + restStatus.missingScopes.join(", ");
    if (restStatus && restStatus.scopes && restStatus.scopes.length) title += "\n" + t("scopes") + restStatus.scopes.join(", ");
    var expAt = (restStatus && restStatus.expiresAt) || restExpiresAt;
    if (expAt) title += "\n" + t("expires") + new Date(expAt).toLocaleString();
    el.tokenBadge.title = title;
  }

  // Sent only on a socket that has received `assigned` — not in the hello, and
  // not on a fresh socket whose handshake is still running (the `channel`
  // variable outlives sockets, so it cannot say that). Sent again after every
  // reconnect, so a Clear made while offline still reaches the server.
  // Nothing saved from this plugin (no token, no dated Clear) → nothing to say.
  function sendRestToken() {
    if (!ws || ws.readyState !== 1 || assignedSock !== ws) return;
    if (!restToken && !restSavedAt) return;
    ws.send(JSON.stringify({ type: "set_rest_token", token: restToken, expiresAt: restToken ? restExpiresAt : null, savedAt: restSavedAt }));
    // A server that never answers (an older build that does not know
    // set_rest_token) must not leave the badge on "Checking…" forever.
    clearTimeout(restAnswerTimer);
    if (restToken) {
      restAnswerTimer = setTimeout(function () {
        restAnswerTimer = null;
        if (!restStatus || restStatus.state === "checking") {
          restStatus = { state: "error", source: "plugin", noAnswer: true };
          renderToken();
        }
      }, REST_ANSWER_MS);
    }
  }

  // One Figma REST request the server made: counters + an activity row.
  function onRestEvent(e) {
    if (!e || typeof e !== "object") return;
    var isWrite = e.kind === "write";
    if (!e.ok) counts.errors++;
    else if (isWrite) counts.writes++;
    else counts.reads++;
    renderStats();
    var text;
    if (e.ok) {
      text = "REST · " + (e.op || "request") + (e.fileKey ? " (" + e.fileKey + ")" : "") + " · " + (e.ms || 0) + "ms";
    } else {
      text = "REST · " + (e.status ? e.status + " " : "") + (e.message || "failed") + " · " + (e.op || "request");
    }
    logRow(text, e.ok ? (isWrite ? "write" : "read") : "error", "REST");
  }

  var lastStateKind = "";
  var lastStateRawText = "";
  function translateStatus(text) {
    if (lang === "en") return text;
    if (text === "Connected") return t("connected");
    if (text === "Connecting…") return t("connecting");
    if (text === "Auto-detecting…") return t("autodetecting");
    return text.replace(/^Connecting to :(\d+)…$/, "Đang kết nối :$1…")
               .replace(/^No answer on :(\d+)$/, "Không phản hồi tại :$1");
  }

  function setState(kind, text) {
    lastStateKind = kind;
    lastStateRawText = text;
    el.dot.className = "dot " + kind;
    el.status.textContent = translateStatus(text);
  }

  function renderMeta() {
    el.port.textContent = connectedPort != null ? (":" + connectedPort) : "—";
    if (hello) {
      el.file.textContent = (hello.fileName || "?") + " · " + (hello.pageName || "");
    }
    el.channelChip.textContent = channel || "—";
    el.channelChip.title = channel ? t("channelCopyPrefix") + channel + "\"" : t("channelWaiting");
  }

  function humanAge(ms) {
    if (ms < 0 || ms == null) return "";
    if (ms < 60000) return Math.max(1, Math.round(ms / 1000)) + "s" + t("agoSuffix");
    if (ms < 3600000) return Math.round(ms / 60000) + "m" + t("agoSuffix");
    return Math.round(ms / 3600000) + "h" + t("agoSuffix");
  }

  // Render the agent-session picker from the latest server push. Each row is
  // one AI agent (Claude Code / Codex session). Picking one binds it to THIS
  // window's channel on the server, so that agent's commands route here.
  function renderAgents() {
    var sessions = (channelsUpdate && channelsUpdate.sessions) || [];
    el.agentCount.textContent = String(sessions.length);
    el.agents.innerHTML = "";
    if (sessions.length === 0) {
      var empty = document.createElement("div");
      empty.className = "agents-empty";
      empty.textContent = t("noSessions");
      el.agents.appendChild(empty);
      return;
    }
    var self = channelsUpdate.self;
    // Users think in files/pages, not channel codenames: label a session's
    // paired window by its fileName · pageName (channel in the tooltip).
    function windowLabel(ch) {
      var wins = channelsUpdate.channels || [];
      for (var i = 0; i < wins.length; i++) {
        if (wins[i].channel === ch) {
          var f = wins[i].fileName || ch;
          return wins[i].pageName ? f + " · " + wins[i].pageName : f;
        }
      }
      return ch;
    }
    sessions.forEach(function (s) {
      var row = document.createElement("div");
      row.className = "agent-row";

      var id = document.createElement("span");
      id.className = "agent-id";
      id.textContent = s.id;
      id.title = s.id;
      row.appendChild(id);

      var meta = document.createElement("span");
      meta.className = "agent-meta";
      meta.textContent = s.writeCount + "w · " + humanAge(s.lastUsedMs);
      row.appendChild(meta);

      var windowCount = (channelsUpdate.channels || []).length;
      if (s.boundChannel === self) {
        var here = document.createElement("span");
        here.className = "agent-state-here";
        here.textContent = t("here");
        here.title = t("hereTitle");
        row.appendChild(here);
      } else if (!s.boundChannel && windowCount <= 1) {
        // Single window: everything routes here anyway — no button needed.
        var auto = document.createElement("span");
        auto.className = "agent-meta";
        auto.textContent = t("auto");
        auto.title = t("autoTitle");
        row.appendChild(auto);
      } else {
        if (s.boundChannel) {
          var other = document.createElement("span");
          other.className = "agent-state-other";
          other.textContent = "→ " + windowLabel(s.boundChannel);
          other.title = t("pairedWith") + s.boundChannel;
          row.appendChild(other);
        }
        var btn = document.createElement("button");
        btn.className = "mini primary";
        btn.textContent = s.boundChannel ? t("moveHere") : t("connect");
        btn.onclick = function () {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: "bind", sessionId: s.id }));
          }
        };
        row.appendChild(btn);
      }
      el.agents.appendChild(row);
    });
  }

  function renderStats() {
    el.statWrites.textContent = String(counts.writes);
    el.statReads.textContent = String(counts.reads);
    el.statErrors.textContent = String(counts.errors);
  }

  function logActivity(op, ok, isWrite) {
    logRow(op + (ok ? "" : " — failed"), !ok ? "error" : (isWrite ? "write" : "read"));
  }

  function logRow(text, kindClass, tag) {
    if (el.activityEmpty) { el.activityEmpty.remove(); el.activityEmpty = null; }
    var row = document.createElement("div");
    row.className = "log-row";
    var time = new Date().toLocaleTimeString();
    row.innerHTML =
      '<span class="log-kind ' + kindClass + '"></span>' +
      (tag ? '<span class="log-tag">[' + escapeHtml(tag) + ']</span>' : "") +
      '<span class="log-op">' + escapeHtml(text) + '</span>' +
      '<span class="log-time">' + escapeHtml(time) + '</span>';
    el.activity.insertBefore(row, el.activity.firstChild);
    while (el.activity.children.length > MAX_LOG_ROWS) {
      el.activity.removeChild(el.activity.lastChild);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function clearActivity() {
    counts = { writes: 0, reads: 0, errors: 0 };
    renderStats();
    el.activity.innerHTML = "";
    var empty = document.createElement("div");
    empty.className = "activity-empty";
    empty.id = "activity-empty";
    empty.textContent = t("noActivity");
    el.activity.appendChild(empty);
    el.activityEmpty = empty;
  }

  setInterval(renderMeta, 1000);

  // ---- talk to the Figma main thread ----
  function toMain(msg) {
    parent.postMessage({ pluginMessage: msg }, "*");
  }

  // ---- resize grip ----
  // Figma only lets the MAIN thread resize the window, so the iframe measures
  // the drag and posts the size; main.ts clamps and persists it. The pointer
  // is captured, so the drag survives leaving the 16px grip.
  var MIN_W = 280, MIN_H = 260, MAX_W = 1600, MAX_H = 1600;
  var grip = document.getElementById("grip");
  var dragFrom = null;   // offset of the pointer from the panel's bottom-right
  var pendingSize = null;

  function flushSize() {
    if (!pendingSize) return;
    var s = pendingSize;
    pendingSize = null;
    toMain({ kind: "resize", width: s.w, height: s.h });
  }

  function onGripMove(e) {
    if (!dragFrom) return;
    var w = Math.round(e.clientX + dragFrom.dx);
    var h = Math.round(e.clientY + dragFrom.dy);
    w = Math.max(MIN_W, Math.min(MAX_W, w));
    h = Math.max(MIN_H, Math.min(MAX_H, h));
    // One post per frame: a raw pointermove stream is ~10x more messages than
    // the window can actually redraw.
    var first = !pendingSize;
    pendingSize = { w: w, h: h };
    if (first) requestAnimationFrame(flushSize);
  }

  if (grip) {
    grip.onpointerdown = function (e) {
      dragFrom = {
        dx: window.innerWidth - e.clientX,
        dy: window.innerHeight - e.clientY,
      };
      grip.setPointerCapture(e.pointerId);
      grip.onpointermove = onGripMove;
      e.preventDefault();
    };
    grip.onpointerup = grip.onpointercancel = function (e) {
      dragFrom = null;
      grip.onpointermove = null;
      flushSize();
      try { grip.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ }
    };
  }

  // Ask the main thread for handshake + hello on load. The socket waits for
  // that hello: connecting first sent a hello with no channel, no resume
  // token and version "0.0.0", so the server assigned a NEW channel and every
  // session bound to this window lost it on each reload.
  toMain({ kind: "handshake" });
  function start() {
    if (started) return;
    started = true;
    connect();
  }
  setTimeout(start, HELLO_WAIT_MS);

  window.onmessage = function (event) {
    var msg = event.data && event.data.pluginMessage;
    if (!msg || typeof msg !== "object") return;
    switch (msg.kind) {
      case "handshake":
        handshake = { pluginVersion: msg.pluginVersion, protocolVersion: msg.protocolVersion };
        break;
      case "hello":
        hello = msg.hello;
        // Restore this file's persisted channel (main thread owns storage).
        if (hello.channel && !channel) channel = hello.channel;
        if (hello.resumeToken && !resumeToken) resumeToken = hello.resumeToken;
        renderMeta();
        // If already connected, (re)send hello so the server has fresh file info.
        if (ws && ws.readyState === 1) sendHello();
        start();
        break;
      case "context": {
        hello = msg.hello || hello;
        renderMeta();
        if (ws && ws.readyState === 1) {
          var h = msg.hello || hello || {};
          ws.send(JSON.stringify({
            type: "context",
            fileName: h.fileName || "",
            pageName: h.pageName || "",
            reason: msg.reason || "selection",
            at: Date.now()
          }));
        }
        break;
      }
      case "rest-token": {
        // The main thread stored, cleared or refused the PAT — or, after a
        // reconnect, says what clientStorage holds right now ("sync").
        if (msg.reason === "rejected") {
          // Nothing changed: the token in use (if any) and its badge stay.
          // The refusal is shown where the user typed.
          // Keep what was typed: one wrong character should be fixable, not retyped.
          el.tokenInput.placeholder = msg.error || t("tokenRejected");
          el.tokenInput.title = msg.error || t("tokenRejected");
          if (restStatus && restStatus.state === "checking") restStatus = pendingStatus;
          renderToken();
          break;
        }
        restToken = typeof msg.token === "string" && msg.token ? msg.token : null;
        restExpiresAt = restToken && typeof msg.expiresAt === "number" ? msg.expiresAt : null;
        restSavedAt = typeof msg.savedAt === "number" ? msg.savedAt : null;
        if (msg.reason !== "sync") {
          el.tokenInput.value = "";
          restStatus = restToken ? { state: "checking", source: "plugin" } : { state: "not_set", source: null };
          renderToken();
        }
        sendRestToken();
        break;
      }
      case "ui-lang": {
        if (!langChosen && (msg.lang === "en" || msg.lang === "vi")) applyLang(msg.lang, true);
        break;
      }
      case "local": {
        var waiting = localPending[msg.id];
        if (!waiting) break;
        delete localPending[msg.id];
        if (msg.ok) waiting.resolve(msg.result);
        else waiting.reject(new Error((msg.error && msg.error.message) || "failed"));
        break;
      }
      case "response":
      case "progress": {
        // Relay main-thread → server over the WS.
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "response", payload: msg.payload }));
        }
        if (msg.kind === "response") {
          var ok = !!(msg.payload && msg.payload.ok);
          var isWrite = !!WRITE_OPS[msg.op];
          if (!ok) counts.errors++;
          else if (isWrite) counts.writes++;
          else counts.reads++;
          renderStats();
          logActivity(msg.op || "unknown", ok, isWrite);
          // An agent just built or removed a demo — the list is stale.
          if (ok && (msg.op === "build_demo" || msg.op === "delete_demo")) refreshDemos();
        }
        break;
      }
    }
  };

  // ---- WebSocket lifecycle ----
  function currentPort() {
    return DEFAULT_PORT + (portIndex % PORT_RANGE);
  }

  function connect() {
    clearTimeout(reconnectTimer);
    reconnectTimer = null;
    attemptCount++;
    var port = currentPort();
    setState("connecting", "Connecting to :" + port + "…");
    renderMeta();

    var url = "ws://localhost:" + port + "/ws";
    // Every handler below checks `sock !== ws` first. Reconnect / Join /
    // Auto-detect close the old socket and connect at once, and the OLD
    // socket's onclose arrives later: acting on the global `ws` it nulled the
    // new socket, stopped its heartbeat, scheduled yet another connect and —
    // on "replaced" — forgot the channel the user had just joined. The window
    // ended up on a random channel with an orphan socket left on the old one.
    var sock;
    try {
      sock = new WebSocket(url);
    } catch (e) {
      scheduleReconnect(true);
      return;
    }
    ws = sock;

    clearTimeout(connectTimer);
    connectTimer = setTimeout(function () {
      if (sock !== ws || sock.readyState !== 0) return;
      // Accepted TCP but never finished the handshake: not our server.
      dropSocket();
      setState("bad", "No answer on :" + port);
      scheduleReconnect(true);
    }, CONNECT_TIMEOUT_MS);

    sock.onopen = function () {
      if (sock !== ws) return;
      clearTimeout(connectTimer);
      connectedPort = port;
      backoff = BACKOFF_MIN;
      attemptCount = 0;
      lostAt = 0;
      lastGoodIndex = portIndex;
      // Seed contact time so the staleness watchdog has a baseline from t=0.
      lastHeartbeatAt = Date.now();
      setState("ok", "Connected");
      sendHello();
      startHeartbeat();
      renderMeta();
    };

    sock.onmessage = function (event) {
      if (sock !== ws) return;
      var data;
      try { data = JSON.parse(event.data); } catch (e) { return; }
      if (!data || typeof data !== "object") return;

      if (data.type === "ping") {
        lastHeartbeatAt = Date.now();
        sock.send(JSON.stringify({ type: "pong", at: Date.now() }));
        return;
      }
      if (data.type === "pong") {
        lastHeartbeatAt = Date.now();
        return;
      }
      if (data.type === "request" && data.payload) {
        // Relay server → main thread.
        toMain({ kind: "request", payload: data.payload });
        return;
      }
      if (data.type === "assigned" && data.channel) {
        // The server confirmed/assigned this window's channel. Persist it so
        // reopening the plugin in this file rejoins the same channel.
        var askedFor = requestedChannel;
        assignedSock = sock;
        channel = data.channel;
        resumeToken = data.resumeToken || null;
        replacedByPeer = false;
        toMain({ kind: "save-channel", channel: channel, resumeToken: resumeToken });
        // Joined: now (and only now) the REST token goes over — read fresh
        // from clientStorage, since another window may have changed it.
        toMain({ kind: "rest-token-request" });
        renderMeta();
        if (askedFor && askedFor !== channel) {
          // Another window of this file still holds the stored channel (the
          // plugin keys it by file name); the server kept that one live and
          // gave this window its own.
          setState("ok", "Connected — \"" + askedFor + "\" is live in another window; this one is \"" + channel + "\"");
        }
        return;
      }
      if (data.type === "channels") {
        channelsUpdate = data;
        renderAgents();
        return;
      }
      if (data.type === "rest_status" && data.status) {
        clearTimeout(restAnswerTimer);
        restAnswerTimer = null;
        restStatus = data.status;
        renderToken();
        return;
      }
      if (data.type === "rest_event") {
        onRestEvent(data);
        return;
      }
    };

    sock.onerror = function () {
      // onclose will handle reconnect.
    };

    sock.onclose = function (event) {
      if (sock !== ws) return; // a socket we already replaced or dropped
      if (assignedSock === sock) assignedSock = null;
      clearTimeout(connectTimer);
      stopHeartbeat();
      if (connectedPort != null) {
        // An established connection dropped: start the fast-retry window.
        lostAt = Date.now();
      }
      ws = null;
      connectedPort = null;
      // Our channel was deliberately taken by another window ("Join" there or
      // a reload). Do NOT rejoin the same channel — that would steal it back
      // in an endless tug-of-war. Reconnect fresh and let the server assign a
      // new one.
      if (event && event.reason === "replaced") {
        replacedByPeer = true;
        channel = null;
        resumeToken = null;
        toMain({ kind: "save-channel", channel: null, resumeToken: null });
        setState("connecting", "Channel moved to another window — rejoining…");
      } else {
        setState("bad", "Disconnected");
      }
      renderMeta();
      scheduleReconnect(event && event.reason === "replaced" ? false : true);
    };
  }

  /**
   * Close the current socket on purpose. Its handlers are detached first, so
   * nothing it does on the way out (its onclose arrives later) can touch the
   * socket that replaces it.
   */
  function dropSocket() {
    clearTimeout(connectTimer);
    stopHeartbeat();
    var old = ws;
    ws = null;
    connectedPort = null;
    if (assignedSock === old) assignedSock = null;
    if (!old) return;
    old.onopen = old.onmessage = old.onerror = old.onclose = null;
    try { old.close(); } catch (e) { /* already closing */ }
  }

  function sendHello() {
    if (!ws || ws.readyState !== 1) return;
    var pv = (handshake && handshake.protocolVersion) || 1;
    var pluginVersion = (handshake && handshake.pluginVersion) || "0.0.0";
    var h = hello || {};
    requestedChannel = channel;
    // Reconstructs the hello field-by-field. pluginBuild MUST be forwarded:
    // the main thread already stamps the bundle, but dropping it here made
    // every reload look like a plugin older than the stamp mechanism itself.
    ws.send(JSON.stringify({
      type: "hello",
      protocolVersion: pv,
      pluginVersion: pluginVersion,
      pluginBuild: h.pluginBuild,
      fileKey: h.fileKey != null ? h.fileKey : null,
      fileName: h.fileName || "",
      pageName: h.pageName || "",
      editorType: h.editorType || "figma",
      channel: channel,
      resumeToken: resumeToken
      // No REST token here: it follows `assigned`, in set_rest_token.
    }));
  }

  function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(function () {
      if (ws && ws.readyState === 1) {
        // Watchdog: if the server has gone silent (crash / silent shutdown) the
        // socket can sit in OPEN forever. Force-close so reconnect kicks in.
        if (lastHeartbeatAt > 0 && Date.now() - lastHeartbeatAt > HEARTBEAT_DEAD_MS) {
          setState("warn", "No response — reconnecting");
          try { ws.close(); } catch (e) {}
          return;
        }
        ws.send(JSON.stringify({ type: "ping", at: Date.now() }));
      }
    }, HEARTBEAT_INTERVAL_MS);
  }
  function stopHeartbeat() {
    if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
  }

  function scheduleReconnect(advancePort) {
    if (reconnectTimer) return;
    if (lostAt > 0 && Date.now() - lostAt < FAST_RETRY_WINDOW_MS) {
      // Just lost a working connection: its server is most likely coming
      // straight back on the same port (restart, takeover by another MCP
      // process). Knock there twice a second instead of walking away.
      portIndex = lastGoodIndex;
      setState("connecting", "Reconnecting to :" + currentPort() + "…");
      reconnectTimer = setTimeout(connect, FAST_RETRY_MS);
      return;
    }
    if (advancePort) {
      // Walk the fallback port range so we find the server wherever it bound.
      portIndex = (portIndex + 1) % PORT_RANGE;
    }
    // Walking the fallback ports is a sweep, not a retry: each port is a fresh
    // target, so it gets a short fixed step. Backoff grows only on the default
    // port. With the 8s cap applied to every step, a restarted server (back on
    // the default port within seconds) waited out a ~80s tour of nine empty
    // ports before the plugin looked at it again.
    var walking = advancePort && portIndex !== 0;
    var wait = walking ? WALK_STEP_MS : backoff;
    setState("connecting", "Retrying in " + Math.round(wait / 100) / 10 + "s…");
    reconnectTimer = setTimeout(connect, wait);
    if (!walking) backoff = Math.min(backoff * 2, BACKOFF_MAX);
  }

  /** Drop the current socket and connect again right away. */
  function reconnectNow() {
    backoff = BACKOFF_MIN;
    lostAt = 0;
    dropSocket();
    clearTimeout(reconnectTimer); reconnectTimer = null;
    started = true;
    connect();
  }

  el.retry.onclick = function () {
    reconnectNow();
  };

  el.clear.onclick = function () {
    clearActivity();
  };

  // ---- channel chip: copy / change / join ----
  el.channelChip.onclick = function () {
    if (!channel) return;
    var ta = document.createElement("textarea");
    ta.value = channel;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    var old = el.channelChip.textContent;
    el.channelChip.textContent = t("copied");
    setTimeout(function () { el.channelChip.textContent = channel || old; }, 900);
  };

  el.channelEdit.onclick = function () {
    el.channelEditor.className = "channel-editor open";
    el.channelInput.value = channel || "";
    el.channelInput.focus();
  };
  el.channelCancel.onclick = function () {
    el.channelEditor.className = "channel-editor";
  };
  el.channelJoin.onclick = function () {
    var v = (el.channelInput.value || "").trim();
    if (!/^[\w.-]{1,64}$/.test(v)) {
      el.channelInput.value = "";
      el.channelInput.placeholder = "letters, digits, - _ . only";
      return;
    }
    channel = v;
    resumeToken = null; // reclaim only after server re-issues on assigned
    toMain({ kind: "save-channel", channel: channel, resumeToken: null });
    el.channelEditor.className = "channel-editor";
    renderMeta();
    // Reconnect so the server re-handshakes us onto the new channel.
    reconnectNow();
  };
  el.channelInput.onkeydown = function (e) {
    if (e.key === "Enter") el.channelJoin.onclick();
    if (e.key === "Escape") el.channelCancel.onclick();
  };

  // ---- REST token: Save / Clear ----
  el.tokenSave.onclick = function () {
    var v = (el.tokenInput.value || "").trim();
    if (!v) {
      el.tokenInput.placeholder = t("tokenPasteFirst");
      return;
    }
    pendingStatus = restStatus;
    restStatus = { state: "checking", source: "plugin" };
    renderToken();
    var days = parseInt(el.tokenExpiry.value, 10);
    toMain({ kind: "save-rest-token", token: v, expiresAt: days > 0 ? Date.now() + days * 86400000 : null });
  };
  el.tokenClear.onclick = function () {
    el.tokenInput.value = "";
    toMain({ kind: "save-rest-token", token: null });
  };
  el.tokenInput.onkeydown = function (e) {
    if (e.key === "Enter") el.tokenSave.onclick();
  };
  renderToken();
  if (el.langEn) el.langEn.onclick = function () { langChosen = true; applyLang("en"); };
  if (el.langVi) el.langVi.onclick = function () { langChosen = true; applyLang("vi"); };
  applyLang(lang, true);
  // The countdown moves on its own.
  setInterval(function () { if (restStatus && (restStatus.state === "valid" || restStatus.state === "rate_limited")) renderToken(); }, 60000);

  // Sweep the whole fallback port range immediately instead of waiting on
  // the backoff timer to walk through it one port at a time.
  el.autodetect.onclick = function () {
    portIndex = 0;
    reconnectNow();
    setState("connecting", "Auto-detecting…");
  };
})();
</script>
